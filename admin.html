<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTFS ADMIN MAP</title>

<style>
body{
margin:0;
font-family:Arial;
background:#050814;
color:white;
}

header{
padding:10px;
display:flex;
justify-content:space-between;
background:rgba(255,255,255,0.05);
}

#map{
position:relative;
width:100vw;
height:100vh;
background:radial-gradient(circle,#0b1228,#000);
}

.plane{
position:absolute;
width:14px;
height:14px;
background:red;
border-radius:50%;
transform:translate(-50%,-50%);
box-shadow:0 0 15px red;
}

svg{
position:absolute;
width:100%;
height:100%;
}

path{
stroke:lime;
stroke-width:2;
fill:none;
}

.panel{
position:fixed;
top:60px;
left:10px;
width:260px;
background:black;
padding:10px;
border:1px solid white;
}

input,textarea,button,select{
width:100%;
margin-top:5px;
padding:8px;
}
</style>
</head>

<body>

<header>
<div>PTFS ADMIN MAP CONTROL</div>
<div id="status">IDLE</div>
</header>

<div id="map">

<svg>
<polyline id="path" points=""></polyline>
</svg>

<div class="plane" id="plane"></div>

</div>

<div class="panel">

<h3>LOGIN</h3>
<input type="password" id="pass">
<button onclick="login()">ENTER</button>

<div id="controls" style="display:none;">

<h3>POSITION</h3>
<input id="x" value="50">
<input id="y" value="50">
<button onclick="setPos()">SET</button>

<h3>FLIGHT PATH</h3>
<textarea id="pathInput"></textarea>
<button onclick="setPath()">SET PATH</button>

<h3>STATUS</h3>
<select id="statusSel">
<option>CRUISING</option>
<option>LANDING</option>
<option>TAKEOFF</option>
<option>EMERGENCY</option>
</select>
<button onclick="setStatus()">UPDATE</button>

</div>

</div>

<script>

function login(){
if(document.getElementById("pass").value==="1234"){
document.getElementById("controls").style.display="block";
document.getElementById("status").innerText="ADMIN ONLINE";
}
}

function setPos(){
let x=document.getElementById("x").value;
let y=document.getElementById("y").value;
let p=document.getElementById("plane");
p.style.left=x+"%";
p.style.top=y+"%";
}

function setPath(){
let raw=document.getElementById("pathInput").value;
let pts=raw.split(" ").map(p=>p.replace(",",",")).join(" ");
document.getElementById("path").setAttribute("points",pts);
}

function setStatus(){
document.getElementById("status").innerText=document.getElementById("statusSel").value;
}

</script>

</body>
</html>
