<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PTFS LIVE FLIGHT TRACKER</title>

<style>
body{
margin:0;
font-family:Arial;
background:#050814;
color:white;
overflow:hidden;
}

header{
padding:12px;
background:rgba(255,255,255,0.05);
display:flex;
justify-content:space-between;
align-items:center;
}

#title{
font-weight:bold;
letter-spacing:2px;
}

#map{
position:relative;
width:100vw;
height:100vh;
background:url('https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg');
background-size:cover;
background-position:center;
}

#plane{
position:absolute;
width:22px;
height:22px;
border-radius:50%;
background:red;
box-shadow:0 0 20px red;
cursor:grab;
transform:translate(-50%,-50%);
}

#plane:active{cursor:grabbing;}

#adminPanel{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

input{
padding:10px;
width:220px;
margin:5px;
}

button{
padding:10px;
width:220px;
background:#1f6feb;
border:none;
color:white;
cursor:pointer;
}

button:hover{background:#388bfd;}

#hud{
position:fixed;
top:10px;
left:10px;
background:rgba(0,0,0,0.5);
padding:10px;
border-radius:10px;
}
</style>
</head>

<body>

<header>
<div id="title">PTFS LIVE CONTROL SYSTEM</div>
<div>DRAG CONTROL MODE</div>
</header>

<div id="map">
<div id="plane"></div>
</div>

<div id="hud">
<div>FLIGHT: <span id="flightNum">NONE</span></div>
<div>STATUS: <span id="status">LOCKED</span></div>
</div>

<div id="adminPanel">
<h2>ADMIN ACCESS</h2>
<input type="password" id="pass" placeholder="Enter Password" />
<button onclick="login()">ENTER</button>
</div>

<script>

let plane=document.getElementById("plane");
let map=document.getElementById("map");
let unlocked=false;
let dragging=false;

plane.style.left="50%";
plane.style.top="50%";

function login(){
if(document.getElementById("pass").value==="1234"){
unlocked=true;
document.getElementById("adminPanel").style.display="none";
document.getElementById("status").innerText="ADMIN UNLOCKED";
}
}

plane.addEventListener("mousedown",()=>{
if(!unlocked)return;
dragging=true;
});

window.addEventListener("mouseup",()=>dragging=false);

map.addEventListener("mousemove",(e)=>{
if(!dragging||!unlocked)return;
let rect=map.getBoundingClientRect();
let x=((e.clientX-rect.left)/rect.width)*100;
let y=((e.clientY-rect.top)/rect.height)*100;
plane.style.left=x+"%";
plane.style.top=y+"%";
});

map.addEventListener("touchmove",(e)=>{
if(!unlocked)return;
let t=e.touches[0];
let rect=map.getBoundingClientRect();
let x=((t.clientX-rect.left)/rect.width)*100;
let y=((t.clientY-rect.top)/rect.height)*100;
plane.style.left=x+"%";
plane.style.top=y+"%";
});

</script>

</body>
</html>
